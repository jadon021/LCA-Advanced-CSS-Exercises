<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadon's Product Showcase</title>
    <link rel="stylesheet" href="week5_ex01_style.css" />
  </head>
  <body>
    <header>
      <h1>Jadon's Product Showcase</h1>
    </header>

    <main class="product-container">
      <div class="product-card">
        <img
          src="https://via.placeholder.com/300x200"
          alt="Wireless Headphones"
        />
        <h2>Wireless Headphones</h2>
        <p class="price">R149.99</p>
        <button>Add to Cart</button>
      </div>

      <!-- Product Card 2 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Smart Watch" />
        <h2>Smart Watch</h2>
        <p class="price">R699.99</p>
        <button>Add to Cart</button>
      </div>

      <!-- Product Card 3 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Running Shoes" />
        <h2>Running Shoes</h2>
        <p class="price">R899.99</p>
        <button>Add to Cart</button>
      </div>

      <!-- Product Card 4 -->
      <div class="product-card">
        <img
          src="https://via.placeholder.com/300x200"
          alt="Minimalist Backpack"
        />
        <h2>Minimalist Backpack</h2>
        <p class="price">R95.00</p>
        <button>Add to Cart</button>
      </div>

      <!-- Product Card 5 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Portable Speaker" />
        <h2>Portable Speaker</h2>
        <p class="price">R399.99</p>
        <button>Add to Cart</button>
      </div>

      <!-- Product Card 6 -->
      <div class="product-card">
        <img
          src="https://via.placeholder.com/300x200"
          alt="Stainless Steel Bottle"
        />
        <h2>Stainless Steel Bottle</h2>
        <p class="price">R249.99</p>
        <button>Add to Cart</button>
      </div>
    </main>
  </body>
</html>
