<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Power Tools — Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="bg-dark text-light d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-warning sticky-top"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold text-warning"
          href="week5_ex04_index.html"
          >APEX POWER TOOLS</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="week5_ex04_index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="week5_ex04_products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="week5_ex04_about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="week5_ex04_contact.html"
                >Contact</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Form -->
    <main class="container my-5" style="max-width: 720px">
      <div class="text-center mb-4">
        <h1 class="fw-bold text-warning animate__animated animate__fadeInDown">
          Contact Us
        </h1>
        <p class="text-secondary animate__animated animate__fadeIn">
          Send us an email inquiry about tools, stock, or bulk orders.
        </p>
      </div>

      <div
        class="card bg-black text-light border-secondary p-4 shadow animate__animated animate__fadeInUp"
      >
        <form action="#" method="get">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control bg-dark text-light border-secondary"
              id="fullName"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="emailAddress" class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control bg-dark text-light border-secondary"
              id="emailAddress"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="mb-3">
            <label for="toolSubject" class="form-label">Subject</label>
            <input
              type="text"
              class="form-control bg-dark text-light border-secondary"
              id="toolSubject"
              placeholder="e.g. Stock enquiry on SDS Rotary Hammer"
            />
          </div>

          <div class="mb-3">
            <label for="messageBox" class="form-label">Message</label>
            <textarea
              class="form-control bg-dark text-light border-secondary"
              id="messageBox"
              rows="4"
              placeholder="Write your message here..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn btn-warning fw-bold px-4">
            Send Email
          </button>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="bg-black text-secondary text-center py-4 mt-auto border-top border-secondary"
    >
      <div class="container">
        <p class="mb-1 text-light fw-semibold">Apex Power Tools</p>
        <small>&copy; 2026 Apex Power Tools. All prices in ZAR (R).</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
